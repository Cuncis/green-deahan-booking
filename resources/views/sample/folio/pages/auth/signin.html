<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Folio - Sign In (converted)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    primary: '#5F41FB', secondary: '#F3F3FB', purple: '#893EFB', pink: '#FF6399', dark: '#212934',
  } } } };
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  h1, h2, h3, h4, h5, h6 { font-family: 'Poppins', sans-serif; }
  .grad-primary { background-image: linear-gradient(90deg, #5F41FB 0%, #893EFB 100%); }
</style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.0.5/swiper-bundle.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.2.0/css/glightbox.min.css">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body class="bg-secondary text-gray-600">

<main class="flex min-h-screen items-center justify-center px-6 py-12">
  <div class="w-full max-w-md rounded-3xl bg-white/70 p-8 text-center shadow-xl backdrop-blur sm:p-10">
    <h1 class="text-2xl font-bold text-gray-900">Sign in</h1>
    <p class="mt-1 text-sm">Don't have an account? <a href="signup.html" class="font-semibold text-primary">Click here to sign up</a></p>

    <form class="mt-6 space-y-4 text-left">
      <input type="email" placeholder="Enter email" class="w-full rounded-lg border border-gray-200 px-4 py-2.5">
      <div class="relative">
        <input type="password" placeholder="Enter your password" class="w-full rounded-lg border border-gray-200 px-4 py-2.5 pr-10">
        <i class="bi bi-eye-slash-fill absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer text-gray-400"></i>
      </div>
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2"><input type="checkbox" class="rounded border-gray-300">Remember me?</label>
        <a href="forgot-password.html" class="text-primary">Forgot password?</a>
      </div>
      <button type="submit" class="w-full rounded-lg bg-primary py-3 font-semibold text-white">Login</button>
      <div class="flex items-center gap-3"><hr class="flex-1 border-gray-200"><span class="text-xs text-gray-400">Or</span><hr class="flex-1 border-gray-200"></div>
      <div class="flex justify-center gap-3">
        <button type="button" class="flex h-11 w-11 items-center justify-center rounded-full bg-blue-600 text-white"><i class="bi bi-facebook"></i></button>
        <button type="button" class="flex h-11 w-11 items-center justify-center rounded-full border border-gray-200 bg-white text-red-500"><i class="bi bi-google"></i></button>
      </div>
      <p class="mt-3 text-center text-xs text-gray-400">Copyrights &copy;2026 Folio. Converted sample for comparison purposes.</p>
    </form>
  </div>
</main>

<button id="back-to-top" type="button" class="fixed bottom-6 right-6 z-50 flex h-11 w-11 items-center justify-center rounded-full bg-primary text-white opacity-0 pointer-events-none shadow-lg" aria-label="Back to top">
  <i class="bi bi-arrow-up"></i>
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.0.5/swiper-bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.1.0/typed.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.2.0/js/glightbox.min.js"></script>
<script src="../../assets/js/site.js"></script>

</body>
</html>
